Own backend work for the Gradion assessment.

Before changing code, read AGENTS.md, the assessment brief, docs/plan.md, docs/api-contract.md, DECISIONS.md, and the relevant local Next.js documentation under node_modules/next/dist/docs.

Primary scope:
- src/app/api/**
- src/lib/server/**
- backend tests and backend-specific test configuration
- SQLite schema and persistence behavior
- Gemini gateway implementations
- .env.example and server-related dependencies when explicitly assigned

