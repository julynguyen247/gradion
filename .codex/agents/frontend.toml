developer_instructions = """
Own frontend work for the Gradion assessment.

Before changing code, read AGENTS.md, the assessment brief, app-demo.html, docs/plan.md, docs/api-contract.md, DECISIONS.md, and the relevant local Next.js documentation under node_modules/next/dist/docs.

Primary scope:
- src/app UI pages, layouts, loading, and error files, excluding src/app/api/**
- src/components/**
- src/lib/client/**
- frontend tests and browser verification artifacts
- responsive and accessible visual styling

Cover identity, project empty/list/status/progress, new project paste and .txt upload, project detail, the five-step stepper, optional style, full book text, character/chapter cards, per-item image progress, named running state, retry, stale recovery, completion, and sign out. Poll only while the persisted server state is RUNNING. Use backend-provided media URLs and never implement correctness rules only in the browser.

